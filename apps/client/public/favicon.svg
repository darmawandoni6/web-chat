<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#181824"/>
    </linearGradient>

    <!-- Main Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent Dot Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>

  <!-- Main Chat Bubble Path -->
  <path d="M 160 140 H 352 C 387.3 140 416 168.7 416 204 V 276 C 416 311.3 387.3 340 352 340 H 236 L 160 392 V 340 C 124.7 340 96 311.3 96 276 V 204 C 96 168.7 124.7 140 160 140 Z" fill="url(#bubbleGrad)"/>

  <!-- Inner Chat Lines -->
  <rect x="160" y="200" width="144" height="24" rx="12" fill="#ffffff" opacity="0.9"/>
  <rect x="160" y="248" width="96" height="24" rx="12" fill="#ffffff" opacity="0.6"/>

  <!-- Online Status Indicator (Emerald Glow) -->
  <circle cx="360" cy="192" r="28" fill="url(#accentGrad)" stroke="#0a0a0f" stroke-width="8"/>
</svg>